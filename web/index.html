<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RockWizard</title>
  <meta name="description" content="Turn any song into a Clone Hero chart.">
  <meta name="theme-color" content="#0c0d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RockWizard">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="mobile-top">
    <div class="brand"><img src="/static/icon-192.png" alt=""><b>Rock<span>Wizard</span></b></div>
    <span id="mpill" class="pill"><span class="dot"></span><span>…</span></span>
  </div>
  <div class="shell">
    <aside class="side">
      <div class="brand"><img src="/static/icon-192.png" alt=""><b>Rock<span>Wizard</span></b></div>
      <nav id="nav"></nav>
      <div class="grow"></div>
      <div class="pill-stack" id="pills"></div>
    </aside>
    <main id="main"></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <script src="/static/app.js"></script>
</body>
</html>
